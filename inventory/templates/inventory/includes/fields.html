{% if form.non_field_errors %}<div class="notice notice-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
    {% if field.is_hidden %}{{ field }}{% else %}
    <div class="field{% if field.errors %} field-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true"> *</span><span class="sr-only"> (обязательно)</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
        {% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
    </div>
    {% endif %}
{% endfor %}
